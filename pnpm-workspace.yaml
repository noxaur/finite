packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@anthropic-ai/claude-agent-sdk": 0.3.309
  "@anthropic-ai/sdk": 1.1.0
  "@babel/parser": 8.0.7
  "@babel/types": 8.0.6
  "@electron/osx-sign": ^1.3.3
  "@modelcontextprotocol/sdk": 1.32.1
  "@stylexjs/babel-plugin": ^0.19.1
  "@stylexjs/postcss-plugin": ^0.19.1
  "@stylexjs/stylex": ^0.19.1
  "@types/busboy": ^1.5.5
  "@types/less": ^3.0.8
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/ws": ^8.18.2
  busboy: ^1.6.0
  chrome-launcher: 1.2.2
  effect: ^4.1.0
  electron: ^45.1.0
  electron-builder: ^26.18.0
  electron-updater: ^6.8.11
  fflate: ^0.8.3
  less: ^4.9.1
  magic-string: ^1.4.5
  next: ^16.4.3
  postcss: ^8.5.31
  postcss-less: ^7.0.1
  postcss-scss: ^4.0.9
  puppeteer-core: 25.16.0
  react: ^19.3.1
  react-dom: ^19.3.1
  sass: ^1.108.0
  tailwind-merge: 3.7.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  ws: 8.22.0
  zod: 4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  # Sass's optional file watcher; Finite only compiles.
  "@parcel/watcher": false
  # Squirrel.Windows tooling that electron-builder pulls in. The Windows build is NSIS.
  electron-winstaller: false
minimumReleaseAgeExclude:
  - sass@1.108.0
