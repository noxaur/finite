packages:
  - apps/*
  - packages/*
  - tools/*
  - crates/*

catalogMode: prefer

catalog:
  "@stylexjs/babel-plugin": ^0.19.1
  "@stylexjs/postcss-plugin": ^0.19.1
  "@stylexjs/stylex": ^0.19.1
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  effect: ^4.1.0
  electron: ^45.1.0
  next: ^16.4.3
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
