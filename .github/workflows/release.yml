# Builds the desktop app for macOS, Windows and Linux when a version tag is
# pushed (`git tag v0.2.0 && git push origin v0.2.0`), and publishes it to
# noxaur/finite-releases, where the app's updater looks (apps/desktop/src/updates.ts).
#
# The release stays a draft until every platform has uploaded, so the
# updater never sees a release with one platform's files missing.
#
# Secrets:
#   RELEASES_TOKEN               a token that can write releases in noxaur/finite-releases
#   MAC_CERTIFICATE              base64 of a "Developer ID Application" .p12
#   MAC_CERTIFICATE_PASSWORD     its password
#   APPLE_API_KEY                an App Store Connect API key (.p8 contents), for notarizing
#   APPLE_API_KEY_ID, APPLE_API_ISSUER  that key's ID and issuer ID
name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  RELEASES_REPO: noxaur/finite-releases

jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Created here, before the builds, so they don't race to create it.
      - run: gh release view "$GITHUB_REF_NAME" -R "$RELEASES_REPO" || gh release create "$GITHUB_REF_NAME" -R "$RELEASES_REPO" --draft --title "Finite ${{ steps.version.outputs.version }}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  build:
    needs: draft
    strategy:
      matrix:
        include:
          # One job builds both Macs, so a single latest-mac.yml lists both.
          - runner: macos-15
            platform: --mac
            arches: arm64 x64
            rust-targets: wasm32-unknown-unknown, aarch64-apple-darwin, x86_64-apple-darwin
          - runner: windows-2025
            platform: --win
            arches: x64
            rust-targets: wasm32-unknown-unknown, x86_64-pc-windows-msvc
          # The oldest supported Ubuntu, so the AppImage runs on older glibc.
          - runner: ubuntu-22.04
            platform: --linux
            arches: x64
            rust-targets: wasm32-unknown-unknown, x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2

      # macOS only installs an update signed by the same developer, so an
      # unsigned Mac build would never update. Fail instead of shipping one.
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          for name in MAC_CERTIFICATE APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is missing"; exit 1; }
          done
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - run: vp run -F web... -F desktop build
      - run: node apps/desktop/scripts/stage-server.mjs ${{ matrix.arches }}
      - working-directory: apps/desktop
        shell: bash
        run: >-
          vp exec electron-builder ${{ matrix.platform }}
          $(printf -- '--%s ' ${{ matrix.arches }})
          --publish always
          -c.extraMetadata.version=${{ needs.draft.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # electron-builder signs with CSC_LINK on every platform, so the
          # Mac certificate goes to the Mac build only.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # Publishing makes it the latest release, which is what the updater reads.
      - run: gh release edit "$GITHUB_REF_NAME" -R "$RELEASES_REPO" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
