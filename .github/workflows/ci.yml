# Runs the checks in `vp run ready`, the end-to-end test, and the tests that
# need Postgres against a Postgres service. One job, so the setup, the Rust
# dependencies and the web build serve every step: GitHub bills each job's
# time rounded up to the minute.
name: CI

# Skips changes that only touch prose. The MCP server's instructions are
# Markdown compiled into it, so Markdown under crates/ still runs.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "crates/**.md"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "crates/**.md"

# A new push to a pull request cancels the run for the push before it. Each
# commit on main is a group of its own, so none is cancelled: a shared group
# would drop a waiting run when the next push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # Line numbers in backtraces, without the rest of the debug info, which
  # makes the build slower to link and the cache bigger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      FINITE_TEST_DATABASE_URL: postgres://postgres:finite@localhost:5432/finite_test
    steps:
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs.
      # Before the tests, since the server's screenshot test starts Chrome.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Postgres for the shared store's tests. Started in the background, not
      # as a service container, so it comes up while the steps before those
      # tests run instead of holding up the first step.
      - run: >-
          nohup docker run --rm --name postgres -p 5432:5432
          -e POSTGRES_PASSWORD=finite -e POSTGRES_DB=finite_test postgres:17
          > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The browser's copy of the document model (crates/wasm).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read main's cache but don't save their own, which
          # would push main's out of the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Saved even when a test fails, so one red run doesn't send the
          # next one back to compiling everything.
          cache-on-failure: true

      # `vp run ready`, with three changes. Cargo runs directly, not under
      # `vp run`, whose file tracking left Chrome, which the screenshot test
      # starts, without a screenshot (and can't hit its cache on a fresh
      # runner anyway). The server's tests run once, with the `postgres`
      # feature, further down. And the server is built in debug, the build
      # the end-to-end test runs; the release build runs on main only.
      - run: vp check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Postgres store is behind the `postgres` cargo feature, off by
      # default, like the desktop app.
      - run: cargo clippy -p finite-server --all-targets --features postgres -- -D warnings
      # The one server test that needs the feature off. Its build leaves the
      # default server in target/debug, kept for the e2e checks without
      # Postgres. A separate `cargo build` would rebuild tokio and
      # everything above it without the `test-util` feature tests turn on.
      - run: cargo test -p finite-server --test no_postgres
      - run: cp target/debug/finite-server "$RUNNER_TEMP/finite-server"
      - run: cargo test -p finite-design
      - run: cargo test -p finite-wasm
      - run: vp run -F web -F desktop test
      - run: vp run -F web... -F desktop build
      - if: github.ref == 'refs/heads/main'
        run: cargo build --release -p finite-server

      # Every server test with the feature on, including the ones that need
      # Postgres (the store's contract, TLS, servers that share one
      # database, failover with real processes), which skip without
      # FINITE_TEST_DATABASE_URL. Its build replaces target/debug/finite-server
      # with one that has the feature.
      # Over TCP: while the image sets up the database, a temporary server
      # answers on the socket only.
      - run: |
          for i in $(seq 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres -q && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/postgres.log"
          exit 1
      - run: cargo test -p finite-server --features postgres

      # The three end-to-end runs at once: they spend most of their time
      # waiting on the browser, and each uses its own ports and folders. One
      # server, then two behind a router, then two sharing this Postgres.
      # Each run's log is printed after all three finish.
      - env:
          E2E_SKIP_BUILD: "1"
        run: |
          e2e() {
            # Its own TMPDIR, so a failure's screenshot isn't overwritten.
            # Named without the colon, which artifact paths can't contain.
            local dir="$RUNNER_TEMP/${1/:/-}"
            mkdir -p "$dir"
            TMPDIR="$dir" vp run "$1" > "$RUNNER_TEMP/$1.log" 2>&1
          }
          E2E_SERVER="$RUNNER_TEMP/finite-server" e2e e2e & one=$!
          E2E_SERVER="$RUNNER_TEMP/finite-server" e2e e2e:router & router=$!
          e2e e2e:shared & shared=$!
          failed=0
          for run in $one $router $shared; do wait "$run" || failed=1; done
          for name in e2e e2e:router e2e:shared; do
            echo "::group::$name"; cat "$RUNNER_TEMP/$name.log"; echo "::endgroup::"
            if grep -q "^FAIL" "$RUNNER_TEMP/$name.log"; then echo "::error::$name failed"; fi
          done
          exit "$failed"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/e2e*/finite-e2e-failure.png
          if-no-files-found: ignore
