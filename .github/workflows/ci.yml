# Runs the same checks as `vp run ready`, then the end-to-end test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The browser's copy of the document model (crates/wasm).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Format, lint and type check (web and Rust), test, build.
      - run: vp run ready

      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: vp run e2e
        env:
          # So a failure's screenshot lands where the next step looks.
          TMPDIR: ${{ runner.temp }}
      # The same checks through a router in front of two servers, reusing those builds.
      - run: vp run e2e:router
        env:
          E2E_SKIP_BUILD: "1"
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/finite-e2e-failure.png
          if-no-files-found: ignore
