# Runs the checks in `vp run ready`, then the end-to-end test. One job, so the
# setup and the web build serve every step: GitHub bills each job's time
# rounded up to the minute.
name: CI

# Skips changes that only touch prose.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"

# A new push to a pull request cancels the run for the push before it. Each
# commit on main is a group of its own, so none is cancelled: a shared group
# would drop a waiting run when the next push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs. The
      # agent's screenshot test and the end-to-end test both start Chrome.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      # `vp run ready`, one step each so a failure names its step. The
      # tests that need the Claude CLI skip without it, and no runner has it.
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build

      # A blank design and the web app through headless Chrome, against the
      # static export the build above wrote to apps/web/out.
      - env:
          E2E_SKIP_BUILD: "1"
          TMPDIR: ${{ runner.temp }}
        run: vp run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/finite-e2e-failure.png
          if-no-files-found: ignore
