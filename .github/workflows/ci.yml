# Runs the checks in `vp run ready`, then the end-to-end test, and the tests
# that need Postgres against a Postgres service.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run for the push before it. Runs
# on main queue instead, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Line numbers in backtraces, without the rest of the debug info, which
  # makes the build slower to link and the cache bigger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs.
      # First, since the server's screenshot test starts Chrome too.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v5
      # TEMP: why the screenshot test gets no PNG.
      - run: |
          google-chrome --version; ls -la /usr/bin/google-chrome; readlink -f /usr/bin/google-chrome
          d=$(mktemp -d); echo '<!doctype html><body style="margin:0;background:#000">x</body>' > $d/index.html
          for size in 540,3000 800,600; do
            timeout 30 google-chrome --headless --disable-gpu --hide-scrollbars --no-first-run --no-default-browser-check --mute-audio --user-data-dir=$d/profile-$size --window-size=$size --force-device-scale-factor=1 --virtual-time-budget=3000 --screenshot=$d/shot-$size.png file://$d/index.html; echo "exit $?"; ls -la $d
          done
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The browser's copy of the document model (crates/wasm).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read main's cache but don't save their own, which
          # would push main's out of the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `vp run ready`, except that the server is built in debug, the
      # build the end-to-end test runs, rather than in release.
      - run: vp check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: vp run -r test
      - run: vp run -F web... -F desktop build
      - run: cargo build -p finite-server

      - run: vp run e2e
        env:
          E2E_SKIP_BUILD: "1"
          # So a failure's screenshot lands where the next step looks.
          TMPDIR: ${{ runner.temp }}
      # The same checks through a router in front of two servers.
      - run: vp run e2e:router
        env:
          E2E_SKIP_BUILD: "1"
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/finite-e2e-failure.png
          if-no-files-found: ignore

  # The Postgres store is behind the `postgres` cargo feature, which the job
  # above leaves off, like the desktop app. This job turns it on: lint, then
  # the tests that need Postgres (the store's contract, TLS, servers that
  # share one database, failover with real processes), which skip without
  # FINITE_TEST_DATABASE_URL, then the end-to-end test on the shared store.
  shared-store:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: finite
          POSTGRES_DB: finite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      FINITE_TEST_DATABASE_URL: postgres://postgres:finite@localhost:5432/finite_test
    steps:
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # e2e:shared builds the web app, which needs crates/wasm.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p finite-server --all-targets --features postgres -- -D warnings
      - run: cargo test -p finite-server --features postgres
      # The end-to-end checks through a router in front of two servers that
      # share this Postgres. It builds the server with the feature itself.
      - run: vp run e2e:shared
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shared-failure
          path: ${{ runner.temp }}/finite-e2e-failure.png
          if-no-files-found: ignore
