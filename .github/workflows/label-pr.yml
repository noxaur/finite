name: label-pr

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            })

            const SIZES = [
              ['size/XS', 10, '3fb950'],
              ['size/S', 30, '7ee787'],
              ['size/M', 100, 'e3b341'],
              ['size/L', 500, 'f0883e'],
              ['size/XL', 1000, 'f85149'],
              ['size/XXL', Infinity, 'b60205'],
            ]

            const SCOPES = [
              ['web', /^apps\/web\//],
              ['desktop', /^apps\/desktop\//],
              ['server', /^crates\/server\//],
              ['design', /^crates\/design\//],
              ['wasm', /^crates\/wasm\//],
              ['e2e', /^e2e\//],
              ['docs', /^(docs\/|[^/]+\.md$)/],
              ['ci', /^\.github\//],
              ['build', /^(\.claude\/|\.vite-hooks\/|Cargo\.toml|package\.json|pnpm-workspace\.yaml|tsconfig\.json|vite\.config\.ts|\.[^/]+$)/],
            ]
            const SCOPE_COLOR = 'c5def5'
            const MAX_SCOPES = 4
            const IGNORED_FOR_SIZE = /(^|\/)(Cargo\.lock|pnpm-lock\.yaml)$/

            const VOUCHED = ['OWNER', 'MEMBER', 'COLLABORATOR']

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            })

            const changed = files
              .filter(f => !IGNORED_FOR_SIZE.test(f.filename))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0)
            const size = SIZES.find(([, max]) => changed < max)

            const counts = new Map()
            for (const f of files) {
              const paths = [f.filename, f.previous_filename].filter(Boolean)
              const hits = new Set(paths.map(path => SCOPES.find(([, re]) => re.test(path))?.[0]))
              for (const name of hits) if (name) counts.set(name, (counts.get(name) ?? 0) + 1)
            }
            const scopes = [...counts].sort((a, b) => b[1] - a[1]).slice(0, MAX_SCOPES).map(([name]) => name)

            const wanted = new Map()
            wanted.set(size[0], size[2])
            for (const name of scopes) wanted.set(`scope: ${name}`, SCOPE_COLOR)

            const vouched = VOUCHED.includes(pr.author_association)
            wanted.set(vouched ? 'vouched' : 'unvouched', vouched ? '2da44e' : 'cf222e')

            const managed = new Set([
              ...SIZES.map(s => s[0]),
              ...SCOPES.map(s => `scope: ${s[0]}`),
              'vouched',
              'unvouched',
            ])

            const current = pr.labels.map(l => l.name)
            for (const name of current.filter(n => managed.has(n) && !wanted.has(n))) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name })
              } catch (error) {
                if (error.status !== 404) throw error
              }
            }

            for (const [name, color] of wanted) {
              if (current.includes(name)) continue
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color })
              } catch (error) {
                if (error.status !== 422) throw error
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [name] })
            }
