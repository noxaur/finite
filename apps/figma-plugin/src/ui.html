<!doctype html>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    padding: 12px;
    font:
      12px/1.4 Inter,
      system-ui,
      sans-serif;
    color: var(--figma-color-text, #222);
    background: var(--figma-color-bg, #fff);
  }
  main {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  button {
    height: 32px;
    border: 1px solid var(--figma-color-border, #ccc);
    border-radius: 6px;
    background: var(--figma-color-bg, #fff);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) {
    background: var(--figma-color-bg-hover, #f2f2f2);
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #result {
    margin: 0;
    min-height: 2.8em;
    overflow-wrap: anywhere;
    color: var(--figma-color-text-secondary, #666);
  }
  #result[data-failed="true"] {
    color: var(--figma-color-text-danger, #c00);
  }
</style>
<main>
  <button id="save" type="button" disabled>Save selection for Finite</button>
  <button id="open" type="button">Open a Finite export</button>
  <input id="file" type="file" accept=".json,application/json" hidden />
  <p id="result" role="status"></p>
</main>
