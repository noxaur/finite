# Packages the desktop app with electron-builder, and names the feed its
# updater reads (src/updates.ts). `vp run desktop#package` builds one for
# this machine; .github/workflows/release.yml builds and publishes all three.
appId: com.noxaur.finite
productName: Finite
# Names the user data folder (~/Library/Application Support/Finite on a Mac)
# and the updater's download cache.
extraMetadata:
  name: finite
  productName: Finite
# The app has no native modules to rebuild.
npmRebuild: false
directories:
  output: release
# Signs the Mac app, before the zip and the disk image are made.
afterPack: scripts/sign-mac.cjs
# main.cjs bundles every dependency but Electron, so the app needs no node_modules.
files:
  - dist/**
  - package.json
extraResources:
  # Staged per architecture by scripts/stage-server.mjs; main.ts finds them here.
  - from: server/${arch}
    to: .
  - from: ../web/out
    to: web

mac:
  category: public.app-category.graphics-design
  # The disk image is for the first install. The updater downloads the zip.
  target: [dmg, zip]
  # electron-builder only signs with a certificate macOS trusts, and ours is
  # self-signed, so afterPack signs the app.
  identity: null
win:
  target: nsis
nsis:
  # A per-user install, so an update never asks for an administrator.
  oneClick: true
  perMachine: false
linux:
  # The updater can only replace an AppImage.
  target: AppImage
  category: Graphics

# The source repository is private, and electron-updater downloads without a
# token, so releases go to a public repository that holds only the builds.
publish:
  provider: github
  owner: noxaur
  repo: finite-releases
