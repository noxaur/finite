# Packages the desktop app with electron-builder. `vp run desktop#package`
# builds one for this machine; .github/workflows/release.yml builds and
# publishes all three.
appId: com.noxaur.finite
productName: Finite
# Names the user data folder (~/Library/Application Support/Finite on a Mac)
# and the updater's download cache.
extraMetadata:
  name: finite
  productName: Finite
# The app has no native modules to rebuild.
npmRebuild: false
directories:
  output: release
# Signs the Mac app, before the zip and the disk image are made.
afterPack: scripts/sign-mac.cjs
# main.cjs bundles every dependency but Electron, so the app needs no node_modules.
files:
  - dist/**
  - package.json
extraResources:
  # The Node server, bundled by `vp run @finite/server#build`, and the blank design
  # template it copies. Electron's own Node runs it (main.ts), so it's the same on
  # every architecture.
  - from: ../server/dist
    to: server/dist
  - from: ../server/scaffold
    to: server/scaffold
    filter: ["**/*", "!node_modules/**", "!dist/**"]
  - from: ../web/out
    to: web

mac:
  category: public.app-category.graphics-design
  # The disk image is for the first install. The updater downloads the zip.
  target: [dmg, zip]
  # electron-builder only signs with a certificate macOS trusts, and ours is
  # self-signed, so afterPack signs the app.
  identity: null
win:
  target: nsis
nsis:
  # A per-user install, so an update never asks for an administrator.
  oneClick: true
  perMachine: false
linux:
  # The updater can only replace an AppImage.
  target: AppImage
  category: Graphics

# No feed, so a local package doesn't look for updates. The release workflow
# sets the bucket it uploads to (-c.publish.url).
publish: null
