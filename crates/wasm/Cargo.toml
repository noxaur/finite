[package]
name = "finite-wasm"
version.workspace = true
edition.workspace = true
publish = false

# A cdylib is what the wasm32 target turns into a .wasm file. The rlib lets
# the tests in this crate run on the host like any other crate's.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
finite-design = { path = "../design" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
