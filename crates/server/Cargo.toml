[package]
name = "finite-server"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
finite-design = { version = "0.0.2", path = "../design" }
finite-transfer = { version = "0.0.2", path = "../transfer" }
futures = "0.3.34"
http = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.8", features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "client",
  "transport-streamable-http-client-reqwest",
  "schemars",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
], optional = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "time",
  "fs",
  "process",
] }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = [
  "ring",
], optional = true }
tokio-tungstenite = "0.29"
tokio-util = "0.7.20"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
# The tests use `testing`: MemoryStore and the helpers in `src/testing.rs`.
finite-server = { path = ".", features = ["testing"] }
http-body-util = "0.1"
png = "0.18.1"
rcgen = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }

[features]
# Servers that share one Postgres database (`FINITE_DATABASE_URL`). Off by
# default, so the desktop app and single-server builds don't compile a
# database client. Build a cluster's servers and routers with
# `cargo build --release -p finite-server --features postgres`.
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]
# `MemoryStore` and the helpers in `src/testing.rs`, for this crate's tests and
# examples. Not part of the server.
testing = []
